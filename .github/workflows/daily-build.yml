name: Daily Build & Deploy

on:
  # 毎日 AM 4:30 JST = UTC 19:30 (前日)
  schedule:
    - cron: '30 19 * * *'

  # 手動実行・push 時も実行
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # ① リポジトリ取得
      - name: Checkout
        uses: actions/checkout@v4

      # ② Node.js セットアップ
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ③ 依存パッケージインストール
      - name: Install dependencies
        run: npm ci

      # ④ データ取得 (気象庁API + 潮汐計算)
      - name: Fetch live data
        env:
          UMINARU_API_KEY: ${{ secrets.UMINARU_API_KEY }}
        run: |
          echo "🎣 データ取得開始: $(date '+%Y-%m-%d %H:%M:%S')"
          node scripts/fetch-data.mjs
          echo "✅ データ取得完了"

      # データ取得結果の確認
      - name: Check generated data
        run: |
          if [ -f src/data/live/_summary.json ]; then
            echo "📊 取得サマリー:"
            cat src/data/live/_summary.json
          fi

      # ⑤ Astro ビルド (GitHub Pages 用にベースパス設定)
      - name: Build Astro site
        run: npm run build
        env:
          # GitHub Pages のサブパス対応 (カスタムドメイン設定後は不要)
          PUBLIC_BASE_URL: ''

      # ⑥ GitHub Pages へデプロイ
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          # cname: tsurinavi.jp  # カスタムドメイン取得後にコメントアウト解除
          commit_message: 'deploy: auto build'

      # ⑦ 完了通知
      - name: Notify result
        if: always()
        run: |
          STATUS="${{ job.status }}"
          echo "$STATUS: $(date '+%Y/%m/%d %H:%M')"
